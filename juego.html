<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Esta línea hace que el juego se vea bien en el celular -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<!-- Para poder "instalarlo" en el celular -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Toca Rápido 🎯</title>
<style>
  /* ============================================================
     COLORES Y ESTILOS DEL JUEGO
     (Los colores que se pueden cambiar están en la ZONA DE LOS NIÑOS,
      más abajo en el código JavaScript)
     ============================================================ */
  :root {
    --verde: #22c55e;
    --dorado: #fbbf24;
    --rojo: #ef4444;
    --fondo1: #0f172a;
    --fondo2: #1e293b;
    --texto: #f8fafc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--texto);
    background: linear-gradient(135deg, var(--fondo1), var(--fondo2));
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  #app { position: fixed; inset: 0; }

  /* ---------- HUD (marcador de puntos y tiempo) ---------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: none;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    font-size: clamp(18px, 5vw, 26px);
    font-weight: 800;
    z-index: 50;
    pointer-events: none;
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  #hud .box {
    background: rgba(0,0,0,.35);
    padding: 8px 16px;
    border-radius: 16px;
    backdrop-filter: blur(6px);
  }
  #tiempo.poco { color: var(--rojo); }
  /* El botón de pausa sí debe recibir el toque (el resto del HUD no) */
  .btnHud {
    pointer-events: auto;
    font-family: inherit;
    font-weight: 800;
    color: var(--texto);
    border: none;
    cursor: pointer;
  }
  .btnHud:active { transform: scale(0.9); }

  /* ---------- Área de juego ---------- */
  #zona { position: fixed; inset: 0; display: none; }

  /* ---------- Los círculos que hay que tocar ---------- */
  .circulo {
    position: absolute;
    width: 78px; height: 78px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5), inset 0 -6px 12px rgba(0,0,0,.25), inset 0 6px 12px rgba(255,255,255,.35);
    cursor: pointer;
    transition: transform .08s ease;
    animation: aparecer .18s ease-out;
    will-change: transform;
  }
  .circulo:active { transform: scale(0.85); } /* efecto de presión al tocar */
  @keyframes aparecer { from { transform: scale(0); } to { transform: scale(1); } }

  .verde  { background: radial-gradient(circle at 35% 30%, #86efac, var(--verde)); }
  .dorado { background: radial-gradient(circle at 35% 30%, #fde68a, var(--dorado)); box-shadow: 0 8px 30px rgba(251,191,36,.7), inset 0 -6px 12px rgba(0,0,0,.2); }
  .rojo   { background: radial-gradient(circle at 35% 30%, #fca5a5, var(--rojo)); }

  /* Texto flotante de puntos (+10, +30, -5) */
  .flotante {
    position: absolute;
    font-weight: 900;
    font-size: 26px;
    pointer-events: none;
    z-index: 40;
    animation: subir .7s ease-out forwards;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
  @keyframes subir { to { transform: translateY(-50px); opacity: 0; } }

  /* ---------- Pantallas de inicio, pausa y fin ---------- */
  .pantalla {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 18px;
    z-index: 100;
  }
  #pantallaFin, #pantallaPausa { display: none; }

  h1 {
    font-size: clamp(34px, 10vw, 60px);
    line-height: 1.05;
    text-shadow: 0 4px 20px rgba(0,0,0,.5);
  }
  .instrucciones {
    background: rgba(0,0,0,.3);
    border-radius: 20px;
    padding: 18px 22px;
    font-size: clamp(15px, 4.5vw, 19px);
    line-height: 1.7;
    max-width: 420px;
  }
  .instrucciones span { font-weight: 800; }

  /* ---------- Selector de idioma ---------- */
  #idiomas { display: flex; gap: 10px; }
  .flag {
    font-size: 30px;
    background: rgba(255,255,255,.08);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 6px 12px;
    cursor: pointer;
    transition: transform .1s ease, border-color .1s ease;
  }
  .flag.activo { border-color: var(--dorado); background: rgba(251,191,36,.18); }
  .flag:active { transform: scale(0.9); }

  .boton {
    margin-top: 8px;
    font-size: clamp(20px, 6vw, 26px);
    font-weight: 900;
    color: #0f172a;
    background: linear-gradient(135deg, #fde68a, var(--dorado));
    border: none;
    border-radius: 999px;
    padding: 18px 44px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(251,191,36,.5);
    transition: transform .1s ease;
  }
  .boton:active { transform: scale(0.92); }

  #puntajeFinal { font-size: clamp(56px, 18vw, 96px); font-weight: 900; color: var(--dorado); text-shadow: 0 4px 24px rgba(251,191,36,.5); }
  #mensajeFinal { font-size: clamp(22px, 6vw, 30px); font-weight: 800; }
  .sub { opacity: .8; font-size: clamp(14px, 4vw, 17px); }
</style>
</head>
<body>
<div id="app">

  <!-- MARCADOR (puntos y tiempo) -->
  <div id="hud">
    <div class="box">⭐ <span id="puntaje">0</span></div>
    <!-- Botón para pausar / salir durante la partida -->
    <button id="btnPausa" class="box btnHud">⏸️</button>
    <div class="box">⏱️ <span id="tiempo">30</span>s</div>
  </div>

  <!-- ÁREA DE JUEGO donde aparecen los círculos -->
  <div id="zona"></div>

  <!-- PANTALLA DE INICIO -->
  <div id="pantallaInicio" class="pantalla">
    <!-- Selector de idioma: Español, Inglés, Francés -->
    <div id="idiomas">
      <button class="flag" data-idioma="en">🇬🇧</button>
      <button class="flag" data-idioma="es">🇪🇸</button>
      <!-- Bandera de Quebec (Fleurdelisé) dibujada como gráfico, porque no existe como emoji -->
      <button class="flag" data-idioma="fr" title="Français (Québec)">
        <svg width="30" height="22" viewBox="0 0 40 30" aria-label="Quebec">
          <rect width="40" height="30" fill="#0d3b9e"/>
          <rect x="18" y="0" width="4" height="30" fill="#fff"/>
          <rect x="0" y="13" width="40" height="4" fill="#fff"/>
          <text x="9"  y="7.5" font-size="8" fill="#fff" text-anchor="middle" dominant-baseline="middle">&#9884;&#65038;</text>
          <text x="31" y="7.5" font-size="8" fill="#fff" text-anchor="middle" dominant-baseline="middle">&#9884;&#65038;</text>
          <text x="9"  y="23.5" font-size="8" fill="#fff" text-anchor="middle" dominant-baseline="middle">&#9884;&#65038;</text>
          <text x="31" y="23.5" font-size="8" fill="#fff" text-anchor="middle" dominant-baseline="middle">&#9884;&#65038;</text>
        </svg>
      </button>
    </div>
    <h1 id="titulo">Toca Rápido 🎯</h1>
    <div class="instrucciones" id="instrucciones"></div>
    <button class="boton" id="btnJugar">▶ JUGAR</button>
    <div class="sub" id="firma">Hecho en familia 👨‍👦‍👦</div>
  </div>

  <!-- PANTALLA DE PAUSA -->
  <div id="pantallaPausa" class="pantalla" style="background:rgba(15,23,42,.75); backdrop-filter:blur(6px);">
    <h1 id="tituloPausa">⏸️ En pausa</h1>
    <div class="sub"><span id="lblPuntajePausa">Puntaje</span>: <span id="puntajePausa">0</span></div>
    <button class="boton" id="btnContinuar">▶ CONTINUAR</button>
    <button class="boton" id="btnSalir" style="background:linear-gradient(135deg,#fca5a5,var(--rojo)); color:#fff; box-shadow:0 10px 30px rgba(239,68,68,.5);">⬅ SALIR</button>
  </div>

  <!-- PANTALLA DE FIN -->
  <div id="pantallaFin" class="pantalla">
    <div class="sub" id="lblTuPuntaje">Tu puntaje</div>
    <div id="puntajeFinal">0</div>
    <div id="mensajeFinal"></div>
    <button class="boton" id="btnReiniciar">🔄 JUGAR DE NUEVO</button>
  </div>

</div>

<script>
/* ================================================================
   ███  ZONA DE LOS NIÑOS  ███
   ================================================================
   ¡Aquí pueden cambiar el juego a su gusto!
   Cambien solo los valores después del signo = y guarden el archivo.
   ================================================================ */

const CONFIG = {

  // ---- IDIOMA con el que arranca el juego ----
  // "es" = español · "en" = inglés · "fr" = francés (Quebec)
  idiomaInicial: "en",

  // ---- COLORES ----  (usen códigos de color, por ejemplo "#22c55e")
  colorVerde:  "#22c55e",   // color del círculo bueno
  colorDorado: "#fbbf24",   // color del círculo especial (vale más)
  colorRojo:   "#ef4444",   // color del círculo malo (resta puntos)

  // ---- EMOJIS de cada círculo ----  (pongan el emoji que quieran)
  emojiVerde:  "✅",
  emojiDorado: "⭐",
  emojiRojo:   "❌",

  // ---- TIEMPO de la partida (en segundos) ----
  duracionSegundos: 30,

  // ---- PUNTOS que da cada círculo ----
  puntosVerde:  10,   // el verde suma 10
  puntosDorado: 30,   // el dorado suma 30
  puntosRojo:   -5,   // el rojo resta 5

  // ---- VELOCIDAD: cada cuántos milisegundos aparece un círculo ----
  // (1000 = 1 segundo. Número más chico = más rápido y más difícil.)
  velocidadAparicion: 700,

  // ---- Cuánto tiempo dura cada círculo antes de desaparecer solo (ms) ----
  duracionCirculo: 1500
};

/* ---- NOMBRE DEL JUEGO en cada idioma ---- */
/* (Cambien el texto entre comillas de cada idioma) */
const NOMBRE = {
  es: "Toca Rápido 🎯",
  en: "Tap Fast 🎯",
  fr: "Tape Vite 🎯"
};

/* ---- TEXTOS Y MENSAJES en los 3 idiomas ---- */
/* (Pueden cambiar cualquier texto entre comillas) */
const TEXTOS = {
  es: {
    verde: "Verde", dorado: "Dorado", rojo: "Rojo",
    puntos: "puntos",
    intro: "Toca los círculos lo más rápido que puedas:",
    noToques: "(¡NO lo toques!)",
    tienes: "Tienes", segundos: "segundos", suerte: "¡Suerte!",
    jugar: "▶ JUGAR",
    firma: "Hecho en familia 👨‍👦‍👦",
    enPausa: "⏸️ En pausa",
    puntaje: "Puntaje",
    continuar: "▶ CONTINUAR",
    salir: "⬅ SALIR",
    tuPuntaje: "Tu puntaje",
    jugarDeNuevo: "🔄 JUGAR DE NUEVO",
    mensajes: [
      { hasta: 49,       texto: "¡Sigue intentando! 🎮" },
      { hasta: 99,       texto: "¡Bien jugado! 💪" },
      { hasta: 199,      texto: "¡Increíble! 🌟" },
      { hasta: Infinity, texto: "¡ERES UNA LEYENDA! 🏆" }
    ]
  },
  en: {
    verde: "Green", dorado: "Gold", rojo: "Red",
    puntos: "points",
    intro: "Tap the circles as fast as you can:",
    noToques: "(do NOT tap it!)",
    tienes: "You have", segundos: "seconds", suerte: "Good luck!",
    jugar: "▶ PLAY",
    firma: "Made as a family 👨‍👦‍👦",
    enPausa: "⏸️ Paused",
    puntaje: "Score",
    continuar: "▶ CONTINUE",
    salir: "⬅ QUIT",
    tuPuntaje: "Your score",
    jugarDeNuevo: "🔄 PLAY AGAIN",
    mensajes: [
      { hasta: 49,       texto: "Keep trying! 🎮" },
      { hasta: 99,       texto: "Well played! 💪" },
      { hasta: 199,      texto: "Amazing! 🌟" },
      { hasta: Infinity, texto: "YOU ARE A LEGEND! 🏆" }
    ]
  },
  fr: {
    verde: "Vert", dorado: "Or", rojo: "Rouge",
    puntos: "points",
    intro: "Touche les cercles le plus vite possible :",
    noToques: "(ne le touche PAS !)",
    tienes: "Tu as", segundos: "secondes", suerte: "Bonne chance !",
    jugar: "▶ JOUER",
    firma: "Fait en famille 👨‍👦‍👦",
    enPausa: "⏸️ En pause",
    puntaje: "Score",
    continuar: "▶ CONTINUER",
    salir: "⬅ QUITTER",
    tuPuntaje: "Ton score",
    jugarDeNuevo: "🔄 REJOUER",
    mensajes: [
      { hasta: 49,       texto: "Continue d'essayer ! 🎮" },
      { hasta: 99,       texto: "Bien joué ! 💪" },
      { hasta: 199,      texto: "Incroyable ! 🌟" },
      { hasta: Infinity, texto: "TU ES UNE LÉGENDE ! 🏆" }
    ]
  }
};

/* ================================================================
   ███  FIN DE LA ZONA DE LOS NIÑOS  ███
   (De aquí para abajo es el motor del juego. No hace falta tocarlo.)
   ================================================================ */

// Aplicar los colores a la página
document.documentElement.style.setProperty('--verde', CONFIG.colorVerde);
document.documentElement.style.setProperty('--dorado', CONFIG.colorDorado);
document.documentElement.style.setProperty('--rojo', CONFIG.colorRojo);

// Referencias a elementos de la página
const zona          = document.getElementById('zona');
const hud           = document.getElementById('hud');
const elPuntaje     = document.getElementById('puntaje');
const elTiempo      = document.getElementById('tiempo');
const pantallaInicio= document.getElementById('pantallaInicio');
const pantallaFin   = document.getElementById('pantallaFin');
const pantallaPausa = document.getElementById('pantallaPausa');
const elPuntajeFinal= document.getElementById('puntajeFinal');
const elMensajeFinal= document.getElementById('mensajeFinal');
const elPuntajePausa= document.getElementById('puntajePausa');

// Variables del juego
let idioma = CONFIG.idiomaInicial;   // idioma actual
let puntaje = 0;
let tiempoRestante = CONFIG.duracionSegundos;
let intervaloAparicion = null;
let intervaloTiempo = null;
let jugando = false;
let enPausa = false;

// Los 3 tipos de círculo con su probabilidad
const TIPOS = [
  { clase: 'verde',  emoji: CONFIG.emojiVerde,  puntos: CONFIG.puntosVerde,  prob: 0.70 },
  { clase: 'dorado', emoji: CONFIG.emojiDorado, puntos: CONFIG.puntosDorado, prob: 0.15 },
  { clase: 'rojo',   emoji: CONFIG.emojiRojo,   puntos: CONFIG.puntosRojo,   prob: 0.15 }
];

// ---- Cambiar todos los textos al idioma elegido ----
function aplicarIdioma(lang) {
  idioma = lang;
  const T = TEXTOS[lang];
  document.documentElement.lang = lang;
  document.title = NOMBRE[lang];
  document.getElementById('titulo').textContent = NOMBRE[lang];

  // Instrucciones (con colores por tipo de círculo)
  document.getElementById('instrucciones').innerHTML =
    T.intro + "<br><br>" +
    '<span style="color:var(--verde)">' + CONFIG.emojiVerde + ' ' + T.verde + '</span> = <span>+' + CONFIG.puntosVerde + ' ' + T.puntos + '</span><br>' +
    '<span style="color:var(--dorado)">' + CONFIG.emojiDorado + ' ' + T.dorado + '</span> = <span>+' + CONFIG.puntosDorado + ' ' + T.puntos + '</span><br>' +
    '<span style="color:var(--rojo)">' + CONFIG.emojiRojo + ' ' + T.rojo + '</span> = <span>' + CONFIG.puntosRojo + ' ' + T.puntos + '</span> ' + T.noToques + '<br><br>' +
    T.tienes + ' <span>' + CONFIG.duracionSegundos + ' ' + T.segundos + '</span>. ' + T.suerte;

  document.getElementById('btnJugar').textContent = T.jugar;
  document.getElementById('firma').textContent = T.firma;
  document.getElementById('tituloPausa').textContent = T.enPausa;
  document.getElementById('lblPuntajePausa').textContent = T.puntaje;
  document.getElementById('btnContinuar').textContent = T.continuar;
  document.getElementById('btnSalir').textContent = T.salir;
  document.getElementById('lblTuPuntaje').textContent = T.tuPuntaje;
  document.getElementById('btnReiniciar').textContent = T.jugarDeNuevo;

  // Marcar la bandera activa
  document.querySelectorAll('.flag').forEach(f => {
    f.classList.toggle('activo', f.dataset.idioma === lang);
  });
}

// Elegir un tipo de círculo al azar según su probabilidad
function elegirTipo() {
  const r = Math.random();
  let acum = 0;
  for (const t of TIPOS) {
    acum += t.prob;
    if (r < acum) return t;
  }
  return TIPOS[0];
}

// Crear un círculo en una posición aleatoria
function crearCirculo() {
  const tipo = elegirTipo();
  const c = document.createElement('div');
  c.className = 'circulo ' + tipo.clase;
  c.textContent = tipo.emoji;

  // Posición aleatoria dentro de la pantalla (dejando margen)
  const tamano = 78;
  const margenArriba = 70; // para no tapar el HUD
  const x = Math.random() * (window.innerWidth  - tamano);
  const y = margenArriba + Math.random() * (window.innerHeight - tamano - margenArriba - 10);
  c.style.left = x + 'px';
  c.style.top  = y + 'px';

  // Al tocar el círculo
  const tocar = (e) => {
    e.preventDefault();
    if (!c.parentNode) return; // ya fue tocado o desapareció
    sumarPuntos(tipo.puntos, x + tamano/2, y);
    c.remove();
  };
  c.addEventListener('touchstart', tocar, { passive: false }); // toque en celular
  c.addEventListener('mousedown', tocar);                      // click en computadora

  zona.appendChild(c);

  // El círculo desaparece solo si no lo tocan
  setTimeout(() => { if (c.parentNode) c.remove(); }, CONFIG.duracionCirculo);
}

// Sumar (o restar) puntos y mostrar el texto flotante
function sumarPuntos(pts, x, y) {
  puntaje += pts;
  if (puntaje < 0) puntaje = 0;
  elPuntaje.textContent = puntaje;

  const f = document.createElement('div');
  f.className = 'flotante';
  f.textContent = (pts >= 0 ? '+' : '') + pts;
  f.style.color = pts >= 0 ? (pts >= CONFIG.puntosDorado ? CONFIG.colorDorado : CONFIG.colorVerde) : CONFIG.colorRojo;
  f.style.left = x + 'px';
  f.style.top  = y + 'px';
  zona.appendChild(f);
  setTimeout(() => f.remove(), 700);
}

// Empezar una partida
function iniciarJuego() {
  puntaje = 0;
  tiempoRestante = CONFIG.duracionSegundos;
  jugando = true;
  enPausa = false;

  elPuntaje.textContent = 0;
  elTiempo.textContent = tiempoRestante;
  elTiempo.classList.remove('poco');

  pantallaInicio.style.display = 'none';
  pantallaFin.style.display = 'none';
  pantallaPausa.style.display = 'none';
  zona.style.display = 'block';
  hud.style.display = 'flex';
  zona.innerHTML = '';

  arrancarRelojes();
}

// Poner en marcha la aparición de círculos y el reloj
function arrancarRelojes() {
  intervaloAparicion = setInterval(crearCirculo, CONFIG.velocidadAparicion);
  intervaloTiempo = setInterval(() => {
    tiempoRestante--;
    elTiempo.textContent = tiempoRestante;
    if (tiempoRestante <= 5) elTiempo.classList.add('poco');
    if (tiempoRestante <= 0) terminarJuego();
  }, 1000);
}

// ---- PAUSAR: congela el tiempo y deja de aparecer círculos ----
function pausarJuego() {
  if (!jugando || enPausa) return;
  enPausa = true;
  clearInterval(intervaloAparicion);
  clearInterval(intervaloTiempo);
  zona.innerHTML = '';                 // limpia los círculos que había en pantalla
  elPuntajePausa.textContent = puntaje;
  pantallaPausa.style.display = 'flex';
}

// ---- CONTINUAR: sigue la partida donde se quedó ----
function continuarJuego() {
  if (!enPausa) return;
  enPausa = false;
  pantallaPausa.style.display = 'none';
  arrancarRelojes();
}

// ---- SALIR: detiene todo y vuelve a la pantalla de inicio ----
function salirAlInicio() {
  enPausa = false;
  jugando = false;
  clearInterval(intervaloAparicion);
  clearInterval(intervaloTiempo);
  zona.innerHTML = '';
  zona.style.display = 'none';
  hud.style.display = 'none';
  pantallaPausa.style.display = 'none';
  pantallaFin.style.display = 'none';
  pantallaInicio.style.display = 'flex';
}

// Terminar la partida y mostrar el resultado
function terminarJuego() {
  jugando = false;
  enPausa = false;
  clearInterval(intervaloAparicion);
  clearInterval(intervaloTiempo);
  zona.innerHTML = '';
  zona.style.display = 'none';
  hud.style.display = 'none';

  elPuntajeFinal.textContent = puntaje;
  elMensajeFinal.textContent = obtenerMensaje(puntaje);
  pantallaFin.style.display = 'flex';
}

// Elegir el mensaje motivacional según el puntaje (en el idioma actual)
function obtenerMensaje(p) {
  const mensajes = TEXTOS[idioma].mensajes;
  for (const m of mensajes) {
    if (p <= m.hasta) return m.texto;
  }
  return mensajes[mensajes.length - 1].texto;
}

// Botones
document.getElementById('btnJugar').addEventListener('click', iniciarJuego);
document.getElementById('btnReiniciar').addEventListener('click', iniciarJuego);
document.getElementById('btnPausa').addEventListener('click', pausarJuego);
document.getElementById('btnContinuar').addEventListener('click', continuarJuego);
document.getElementById('btnSalir').addEventListener('click', salirAlInicio);

// Botones de idioma
document.querySelectorAll('.flag').forEach(f => {
  f.addEventListener('click', () => aplicarIdioma(f.dataset.idioma));
});

// Evitar que el navegador haga zoom con doble toque
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

// Arrancar con el idioma inicial
aplicarIdioma(CONFIG.idiomaInicial);
</script>
</body>
</html>
